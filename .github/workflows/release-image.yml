name: Release image (date tag)

# 日期 tag 触发：校验 → 多架构构建 → 推 Docker Hub（不可变的日期 tag，另刷一个只作人肉拉取用的 latest）
# → 把 release 分支快进到这个 tag 并通知 Argo CD 部署生产（GoSail ADR-0005）。
# 生产部署哪一版由 deploy/k8s/linksail/overlays/prod 决定，scripts/release-tag.sh --prepare 在打 tag 前写好它。
# 约定与调用见 fleet-doc/git.md 与 fleet-doc/ops.md，实现与它们保持一致。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: hubwu42/new-api
  PROD_OVERLAY: deploy/k8s/linksail/overlays/prod/kustomization.yaml

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      is_dry: ${{ steps.tag.outputs.is_dry }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and its source
        id: tag
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 形状、当日序号、倒序发布由脚本判定；它认 GITHUB_ACTIONS/GITHUB_REF，
          # 对触发本次运行的那个 tag 不做「已用」判定。
          bash scripts/release-tag.sh --check "$RAW_TAG"

          # tag 必须切在 main 上
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

          image_tag="${RAW_TAG#v}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          case "$RAW_TAG" in
            *-dry.*) echo "is_dry=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "is_dry=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # 正式 tag 所在的提交必须已经把生产覆盖层钉到本版：release 快进到这个提交后，
      # Argo CD 部署的就是覆盖层里写的版本。钉错了就在构建前停下，不推镜像。
      - name: Verify the production overlay pins this release
        if: steps.tag.outputs.is_dry != 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          pinned=$(awk -v img="$IMAGE" '
            $1 == "-" && $2 == "name:" { inside = ($3 == img); next }
            inside && $1 == "newTag:" { print $2; exit }
          ' "$PROD_OVERLAY")
          if [ "$pinned" != "$IMAGE_TAG" ]; then
            echo "::error::${PROD_OVERLAY} 钉的是 ${pinned:-<空>}，不是 ${IMAGE_TAG}；先跑 scripts/release-tag.sh --prepare 并合进 main 再打 tag"
            exit 1
          fi

  build:
    name: Build & push (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile 会把仓库根的 VERSION 编进二进制（Go 的 -X common.Version）与前端
      # （VITE_REACT_APP_VERSION）。仓里那个文件是空的，不写就等于发布产物没有版本号。
      - name: Write release identity into VERSION
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: printf '%s' "$TAG" > VERSION

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.image_tag }}-${{ matrix.arch }}

  manifest:
    name: Publish manifests
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge per-arch images into the release tag
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
          IS_DRY: ${{ needs.verify.outputs.is_dry }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

          # `latest` 只在正式发布时刷新（干跑只留自己的日期 tag），而且它只作人肉拉取用——
          # 部署那一步在 linksail 那边把 `docker_registry_image_tag` 钉到具体日期 tag。
          if [ "$IS_DRY" != "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          fi

          echo "### 镜像" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # 自检：产物里必须真的能搜到本次发布标识，否则这一版不许往正式发布走。
      - name: Verify the embedded release identity
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}:${TAG}-amd64" > /dev/null
          count=$(docker run --rm --entrypoint /bin/grep "${IMAGE}:${TAG}-amd64" -ac "$TAG" /new-api || true)
          echo "镜像内嵌版本字符串出现次数：${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::镜像里搜不到本次发布标识 ${TAG}"
            exit 1
          fi
          echo "- 版本自检通过：镜像内嵌 \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote release branch
    needs: [verify, manifest]
    if: needs.verify.outputs.is_dry != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 生产的 Argo CD Application 跟 release 分支。只快进、绝不强推：
      # 被拒说明 release 上有不在这个 tag 历史里的提交，要人来看，不能覆盖。
      - name: Fast-forward release to the tag
        run: |
          set -euo pipefail
          git push origin "${GITHUB_SHA}:refs/heads/release"
          echo "- release 分支快进到 \`${GITHUB_SHA::7}\`（${GITHUB_REF_NAME}）" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Argo CD
        env:
          ARGOCD_WEBHOOK_SECRET: ${{ secrets.ARGOCD_WEBHOOK_SECRET }}
        run: bash .github/scripts/argocd-webhook.sh release "$GITHUB_SHA"
