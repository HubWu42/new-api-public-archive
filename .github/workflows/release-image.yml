name: Release image (date tag)

# 日期 tag 触发：校验 → 多架构构建 → 推 Docker Hub（不可变的日期 tag，另刷一个只作人手拉取用的 latest）
# → 把这个版本回写进 main 的 deploy/k8s/linksail/overlays/prod 并通知 Argo CD 部署生产（GoSail ADR-0008）。
# 手动触发输入一个已发布过的正式 tag：镜像已存在，不构建，只回写 overlays/prod，用于生产回滚。
# 约定与调用见 fleet-doc/git.md 与 fleet-doc/ops.md，实现与它们保持一致。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布过的正式 tag，例如 v2026.10.8-r1；只把它回写进 overlays/prod（回滚用）'
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: hubwu42/new-api
  PROD_OVERLAY: deploy/k8s/linksail/overlays/prod

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.tag.outputs.git_tag }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      is_dry: ${{ steps.tag.outputs.is_dry }}
      rollback: ${{ steps.tag.outputs.rollback }}
    steps:
      # 手动触发用的是所选分支上的这份文件；只认 main，免得别的分支改过的流程去写生产版本。
      - name: Refuse non-main dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::手动触发只能选 main，当前是 ${GITHUB_REF}"
          exit 1

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and its source
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            raw_tag=$PUSHED_TAG
            # 形状、当日序号、倒序发布由脚本判定；它认 GITHUB_ACTIONS/GITHUB_REF，
            # 对触发本次运行的那个 tag 不做「已用」判定。
            bash scripts/release-tag.sh --check "$raw_tag"
            sha=$GITHUB_SHA
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          else
            # 回滚只接受已经存在的正式 tag；它在推送时已过 --check，镜像是否真发布成功由下一步核对。
            raw_tag=$INPUT_TAG
            case "$raw_tag" in
              v*-dry.*) echo "::error::干跑 tag 不能回写生产：${raw_tag}"; exit 1 ;;
              v*) ;;
              *) echo "::error::不是日期 tag：${raw_tag}"; exit 1 ;;
            esac
            sha=$(git rev-parse -q --verify "refs/tags/${raw_tag}^{commit}") \
              || { echo "::error::仓里没有 tag ${raw_tag}"; exit 1; }
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          fi

          # tag 必须切在 main 上
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" FETCH_HEAD \
            || { echo "::error::${raw_tag} 不在 main 上"; exit 1; }

          {
            echo "git_tag=$raw_tag"
            echo "image_tag=${raw_tag#v}"
          } >> "$GITHUB_OUTPUT"
          case "$raw_tag" in
            *-dry.*) echo "is_dry=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "is_dry=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Log in to Docker Hub
        if: steps.tag.outputs.rollback == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 回滚不重新构建：镜像不在说明这个 tag 当初没发布成功，回写进生产只会拉不到镜像。
      - name: Require the release image for rollback
        if: steps.tag.outputs.rollback == 'true'
        env:
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          if ! err=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" 2>&1 >/dev/null); then
            if grep -qiE 'not found|manifest unknown' <<<"$err"; then
              echo "::error::Docker Hub 上没有 ${IMAGE}:${TAG}，这个 tag 没发布成功过；要发这份代码就打一个新 tag"
            else
              echo "::error::查询 ${IMAGE}:${TAG} 出错（鉴权或网络），无法确认镜像存在，回滚中止：${err}"
            fi
            exit 1
          fi
          echo "- 回滚：镜像 \`${IMAGE}:${TAG}\` 已存在，跳过构建" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & push (${{ matrix.arch }})
    needs: verify
    if: needs.verify.outputs.rollback != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile 会把仓库根的 VERSION 编进二进制（Go 的 -X common.Version）与前端
      # （VITE_REACT_APP_VERSION）。仓里那个文件是空的，不写就等于发布产物没有版本号。
      - name: Write release identity into VERSION
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: printf '%s' "$TAG" > VERSION

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.verify.outputs.image_tag }}-${{ matrix.arch }}

  manifest:
    name: Publish manifests
    needs: [verify, build]
    if: needs.verify.outputs.rollback != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge per-arch images into the release tag
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
          IS_DRY: ${{ needs.verify.outputs.is_dry }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

          # `latest` 只在正式发布时刷新（干跑只留自己的日期 tag），而且它只作人手拉取用——
          # 生产部署的是 overlays/prod 里写的具体日期 tag。
          if [ "$IS_DRY" != "true" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          fi

          echo "### 镜像" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      # 自检：产物里必须真的能搜到本次发布标识，否则这一版不许往正式发布走。
      - name: Verify the embedded release identity
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${IMAGE}:${TAG}-amd64" > /dev/null
          count=$(docker run --rm --entrypoint /bin/grep "${IMAGE}:${TAG}-amd64" -ac "$TAG" /new-api || true)
          echo "镜像内嵌版本字符串出现次数：${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::镜像里搜不到本次发布标识 ${TAG}"
            exit 1
          fi
          echo "- 版本自检通过：镜像内嵌 \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Pin production overlay and notify Argo CD
    needs: [verify, manifest]
    # 正常发布要等镜像合成并自检通过；回滚时 build 与 manifest 被跳过，镜像存在已在 verify 核对过。
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.verify.outputs.is_dry != 'true'
      && (needs.verify.outputs.rollback == 'true' || needs.manifest.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit the release image tag
        env:
          TAG: ${{ needs.verify.outputs.image_tag }}
          GIT_TAG: ${{ needs.verify.outputs.git_tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          (cd "$PROD_OVERLAY" && kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}")
          if git diff --quiet; then
            echo "生产覆盖层已经是 ${TAG}，无需提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # GITHUB_TOKEN 推的提交不触发 workflow，提交信息不带 [skip ci]：tag 打在这个提交上也能触发发版。
          git commit -am "chore(deploy): prod 环境镜像改为 ${TAG}（${GIT_TAG}）"
          # 和测试版回写或别的提交挨得很近时，推送会被拒；把别人的提交拉下来再推，最多五次。
          # 两条回写改的是不同文件，rebase 不会冲突；不共用 concurrency 组，免得同组排队时互相取消。
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "- 生产环境镜像改为 \`${TAG}\`（${GIT_TAG}）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "推送被拒，第 ${attempt} 次重试"
            git pull --rebase origin main
          done
          echo "::error::五次都没能把生产版本号推回 main"
          exit 1

      - name: Notify Argo CD
        env:
          ARGOCD_WEBHOOK_SECRET: ${{ secrets.ARGOCD_WEBHOOK_SECRET }}
        run: bash .github/scripts/argocd-webhook.sh main "$(git rev-parse HEAD)"
