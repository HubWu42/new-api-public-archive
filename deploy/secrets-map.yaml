# LinkSail 的机密对照表：集群里每个 Secret 的每个键，对应 settings.local.json 里 env 下的哪个键。
# 格式与用法见 GoSail 工作空间仓的 deploy/secrets-map.yaml 文件头；推进集群：
#   node <工作空间>/deploy/scripts/secrets.js push --cluster test|prod --map deploy/secrets-map.yaml
# 凭证值只在 settings.local.json，这里只有键名。

secrets:
  # 测试环境（家里测试集群）的服务凭证
  - clusters: [test]
    namespace: linksail
    name: linksail-secrets
    data:
      DB_PASSWORD: GOSAIL_PG_NEWAPI_TEST_PASSWORD
      REDIS_PASSWORD: GOSAIL_REDIS_CN_TEST_PASSWORD
      SESSION_SECRET: GOSAIL_LINKSAIL_TEST_SESSION_SECRET
      CRYPTO_SECRET: GOSAIL_LINKSAIL_TEST_CRYPTO_SECRET

  # 生产环境的服务凭证
  - clusters: [prod]
    namespace: linksail
    name: linksail-secrets
    data:
      DB_PASSWORD: GOSAIL_PG_NEWAPI_PROD_PASSWORD
      REDIS_PASSWORD: GOSAIL_REDIS_CN_PASSWORD
      SESSION_SECRET: GOSAIL_LINKSAIL_PROD_SESSION_SECRET
      CRYPTO_SECRET: GOSAIL_LINKSAIL_PROD_CRYPTO_SECRET

  # 区域 PG 里两个账号的密码，CloudNativePG 按它建角色（PG 只在生产集群，所以两份都推进 prod）
  - clusters: [test]
    namespace: data-cn
    name: pg-cn-role-newapi-test
    type: kubernetes.io/basic-auth
    literals:
      username: newapi_test
    data:
      password: GOSAIL_PG_NEWAPI_TEST_PASSWORD

  - clusters: [prod]
    namespace: data-cn
    name: pg-cn-role-newapi-prod
    type: kubernetes.io/basic-auth
    literals:
      username: newapi_prod
    data:
      password: GOSAIL_PG_NEWAPI_PROD_PASSWORD
